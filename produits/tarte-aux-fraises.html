  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: #fff8f5;
      color: #3b2326;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(78, 38, 43, 0.08);
      border: 1px solid rgba(224, 185, 175, 0.4);
    }
    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 24px 20px;
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #c25e68;
      background: #fdebed;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: #2c1619;
      margin-bottom: 8px;
    }
    p {
      color: #6d5256;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .price {
      font-size: 22px;
      font-weight: 700;
      color: #c25e68;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #c25e68;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 99px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #a84852;
    }
  </style>

  <div class="card">

      <span class="tag">Fruité</span>
